<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>溱溱有味</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    body {
      margin: 0;
      background: #f5efe6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .menu-wrap { position: fixed; top: 1rem; left: 1rem; z-index: 100; }
    .menu-btn { width: 42px; height: 42px; border-radius: 50%; background: rgba(255,254,249,0.95); border: 1px solid rgba(212,165,116,0.4); font-size: 1.3rem; cursor: pointer; box-shadow: 0 2px 8px rgba(74,63,53,0.12); }
    .menu-dropdown { display: none; position: absolute; top: 50px; left: 0; background: #fffef9; border-radius: 8px; box-shadow: 0 4px 16px rgba(74,63,53,0.15); overflow: hidden; min-width: 140px; }
    .menu-dropdown.show { display: block; }
    .menu-dropdown a { display: block; padding: 0.7rem 1.2rem; color: #4a3f35; text-decoration: none; font-size: 0.95rem; }
    .menu-dropdown a:hover { background: #f8f4ec; }
    h1 {
      font-family: 'ZCOOL XiaoWei', 'Noto Serif TC', serif;
      font-size: 4rem;
      color: #4a3f35;
      margin: 0;
      letter-spacing: 0.15em;
    }
  </style>
</head>
<body>
  <div class="menu-wrap">
    <button class="menu-btn" id="menu-btn">☰</button>
    <div class="menu-dropdown" id="menu-dropdown">
      <a href="/">首頁</a>
      <a href="/menu">私房菜菜單</a>
      <a href="/about">關於我們</a>
      <a href="/memories">Memories</a>
    </div>
  </div>

  <h1>溱溱有味</h1>
  <button id="play-btn" style="background:none;border:none;font-size:2rem;cursor:pointer;margin-top:1rem;">🔇</button>

  <video id="bg-video" loop style="display:none;">
    <source src="/static/video/intro.mp4" type="video/mp4">
  </video>

  <script>
    document.getElementById('play-btn').onclick = function() {
      var video = document.getElementById('bg-video');
      if (video.paused) {
        video.play();
        this.textContent = '🔊';
      } else {
        video.pause();
        this.textContent = '🔇';
      }
    };

    document.getElementById('menu-btn').onclick = function(e) {
      e.stopPropagation();
      document.getElementById('menu-dropdown').classList.toggle('show');
    };
    document.onclick = function() {
      document.getElementById('menu-dropdown').classList.remove('show');
    };
  </script>
</body>
</html>
